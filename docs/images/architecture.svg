<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="912" viewBox="0 0 1530 912">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#27272a"/></marker></defs>
<rect x="0" y="0" width="1530" height="912" fill="#ffffff"/>
<text x="30" y="42" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#27272a" text-anchor="start">qitt: a proactive chief of staff inside T3 Code</text>
<text x="30" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#52525b" text-anchor="start">One pinned thread reads the requests that reach its owner, decides what each one needs, and hands the research to worker threads, so a brief and a proposed</text>
<text x="30" y="88" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#52525b" text-anchor="start">reply are ready ahead of time. It never sends anything for its owner. Every source of requests is a module, and the core does not change when one is added.</text>
<rect x="30" y="110" width="350" height="662" rx="16" fill="#edf7ef" stroke="#2f855a" stroke-width="2"/>
<text x="48" y="138" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#22543d" text-anchor="start">Sources: one module each</text>
<rect x="50" y="160" width="310" height="150" rx="12" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
<text x="66" y="186" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#27272a" text-anchor="start">Slack</text>
<text x="66" y="208" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">slack-bridge holds a Socket Mode</text>
<text x="66" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">connection for DMs and polls search for</text>
<text x="66" y="244" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">mentions and the owner's threads. It</text>
<text x="66" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">filters, dedupes and batches. It only reads.</text>
<rect x="50" y="330" width="310" height="112" rx="12" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
<text x="66" y="356" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#27272a" text-anchor="start">JIRA</text>
<text x="66" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">An automation rule calls a webhook relay</text>
<text x="66" y="396" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">on each issue event. The relay signs</text>
<text x="66" y="414" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">every delivery (HMAC).</text>
<rect x="50" y="462" width="310" height="130" rx="12" fill="#ffffff" stroke="#2f855a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="66" y="488" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#27272a" text-anchor="start">Your source</text>
<text x="66" y="510" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">Teams, email, GitHub, a pager: its own</text>
<text x="66" y="528" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">webhooks through the filter, or a small</text>
<text x="66" y="546" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">bridge that posts on localhost.</text>
<rect x="50" y="630" width="310" height="132" rx="12" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
<text x="66" y="656" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#27272a" text-anchor="start">Tools for the agents</text>
<text x="66" y="678" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">MCP servers and skills to read each</text>
<text x="66" y="696" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">source and save drafts. Each module</text>
<text x="66" y="714" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">lists the send tools to deny, so nothing</text>
<text x="66" y="732" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">goes out in the owner's name.</text>
<rect x="420" y="330" width="180" height="262" rx="12" fill="#f4f4f5" stroke="#71717a" stroke-width="2"/>
<text x="436" y="356" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#27272a" text-anchor="start">Hook filter</text>
<text x="436" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">The only port open to</text>
<text x="436" y="396" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">outside callers.</text>
<text x="436" y="414" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start"></text>
<text x="436" y="432" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">Forwards /api/hooks/*</text>
<text x="436" y="450" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">to T3, checks the</text>
<text x="436" y="468" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">HMAC signature, and</text>
<text x="436" y="486" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">drops duplicates.</text>
<rect x="650" y="110" width="520" height="662" rx="16" fill="#eaf2fb" stroke="#2f6db5" stroke-width="2"/>
<text x="668" y="138" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1e4f8a" text-anchor="start">T3 Code server, on one always-on machine</text>
<rect x="670" y="160" width="480" height="118" rx="12" fill="#ffffff" stroke="#2f6db5" stroke-width="2"/>
<text x="686" y="186" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#27272a" text-anchor="start">Scheduled tasks, bound to the qitt thread</text>
<text x="686" y="208" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">One webhook task per source: each delivery becomes a turn in the qitt</text>
<text x="686" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">thread, with the module's intake.md as its prompt. Plus a weekday sweep.</text>
<rect x="670" y="328" width="480" height="200" rx="12" fill="#ffffff" stroke="#2f6db5" stroke-width="3.5"/>
<text x="686" y="354" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e4f8a" text-anchor="start">qitt: the pinned thread</text>
<text x="686" y="376" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">Charter = core rules + one section per installed source + the local</text>
<text x="686" y="394" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">context, assembled by bin/install-profiles.</text>
<text x="686" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start"></text>
<text x="686" y="430" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">For each item it decides: nothing needed, a reminder, a short brief,</text>
<text x="686" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">a follow-up in the thread that owns it, or a new worker.</text>
<text x="686" y="466" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">It searches open, settled and peer threads before starting one,</text>
<text x="686" y="484" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">and keeps the board of all work in flight.</text>
<rect x="670" y="620" width="230" height="132" rx="12" fill="#ffffff" stroke="#2f6db5" stroke-width="2"/>
<text x="686" y="646" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#27272a" text-anchor="start">Worker threads</text>
<text x="686" y="668" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">One per request. Read the source</text>
<text x="686" y="686" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">in full, gather evidence, write</text>
<text x="686" y="704" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">a brief and a proposed reply.</text>
<text x="686" y="722" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">Research only.</text>
<rect x="920" y="620" width="230" height="132" rx="12" fill="#ffffff" stroke="#2f6db5" stroke-width="2"/>
<text x="936" y="646" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#27272a" text-anchor="start">Hand-started threads</text>
<text x="936" y="668" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">Work the owner began by hand</text>
<text x="936" y="686" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">owns its follow-ups too. qitt sends</text>
<text x="936" y="704" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">them there, which wakes the thread.</text>
<rect x="1250" y="160" width="250" height="118" rx="12" fill="#f4f4f5" stroke="#71717a" stroke-width="2"/>
<text x="1266" y="186" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#27272a" text-anchor="start">Two rules</text>
<text x="1266" y="208" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">1. It never sends for its owner.</text>
<text x="1266" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">2. T3 constructs only: threads</text>
<text x="1266" y="244" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">and scheduled tasks.</text>
<rect x="1250" y="328" width="250" height="200" rx="12" fill="#ffffff" stroke="#71717a" stroke-width="2"/>
<text x="1266" y="354" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#27272a" text-anchor="start">The owner</text>
<text x="1266" y="376" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">Asks qitt anything, without giving</text>
<text x="1266" y="394" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">context.</text>
<text x="1266" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start"></text>
<text x="1266" y="430" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">Reads the briefs, edits the drafts</text>
<text x="1266" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">and sends them.</text>
<text x="1266" y="466" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">Settles threads when they are done.</text>
<rect x="1250" y="620" width="250" height="132" rx="12" fill="#ffffff" stroke="#71717a" stroke-width="2"/>
<text x="1266" y="646" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#27272a" text-anchor="start">Peer T3 servers</text>
<text x="1266" y="668" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">For example a laptop, for work</text>
<text x="1266" y="686" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">only that machine can do. qitt</text>
<text x="1266" y="704" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">lists, searches and launches</text>
<text x="1266" y="722" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#27272a" text-anchor="start">threads there.</text>
<path d="M360,205 L670,205" fill="none" stroke="#27272a" stroke-width="1.6" marker-end="url(#head)"/>
<text x="515" y="197" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52525b" text-anchor="middle">batches, POST on localhost</text>
<path d="M360,386 L420,386" fill="none" stroke="#27272a" stroke-width="1.6" marker-end="url(#head)"/>
<path d="M360,527 L420,527" fill="none" stroke="#27272a" stroke-width="1.6" marker-end="url(#head)"/>
<path d="M510,330 L510,250 L670,250" fill="none" stroke="#27272a" stroke-width="1.6" marker-end="url(#head)"/>
<text x="592" y="268" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52525b" text-anchor="middle">signed deliveries</text>
<path d="M910,278 L910,328" fill="none" stroke="#27272a" stroke-width="1.6" marker-end="url(#head)"/>
<text x="920" y="308" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52525b" text-anchor="start">each delivery wakes qitt</text>
<path d="M690,528 L690,620" fill="none" stroke="#27272a" stroke-width="1.6" marker-end="url(#head)"/>
<text x="698" y="568" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52525b" text-anchor="start">t3_thread_launch</text>
<text x="698" y="583" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52525b" text-anchor="start">+ work-item header</text>
<path d="M826,620 L826,528" fill="none" stroke="#27272a" stroke-width="1.6" marker-end="url(#head)"/>
<text x="834" y="576" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52525b" text-anchor="start">ready / blocked</text>
<path d="M1035,528 L1035,620" fill="none" stroke="#27272a" stroke-width="1.6" marker-end="url(#head)"/>
<text x="1027" y="568" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52525b" text-anchor="end">follow-up,</text>
<text x="1027" y="583" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52525b" text-anchor="end">t3_thread_send</text>
<path d="M1105,528 L1105,574 L1375,574 L1375,620" fill="none" stroke="#27272a" stroke-width="1.6" marker-end="url(#head)"/>
<text x="1272" y="566" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52525b" text-anchor="middle">list, search, launch</text>
<path d="M1250,398 L1150,398" fill="none" stroke="#27272a" stroke-width="1.6" marker-end="url(#head)"/>
<text x="1211" y="390" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52525b" text-anchor="middle">questions</text>
<path d="M1150,458 L1250,458" fill="none" stroke="#27272a" stroke-width="1.6" marker-end="url(#head)"/>
<text x="1211" y="450" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52525b" text-anchor="middle">the board</text>
<path d="M670,696 L360,696" fill="none" stroke="#27272a" stroke-width="1.6" marker-end="url(#head)"/>
<text x="515" y="688" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52525b" text-anchor="middle">read the source, save drafts</text>
<rect x="30" y="802" width="1470" height="84" rx="12" fill="#ffffff" stroke="#71717a" stroke-width="1.5"/>
<text x="48" y="834" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#27272a" text-anchor="start">A source module is a folder.</text>
<text x="236" y="834" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#27272a" text-anchor="start">sources/&lt;name&gt;/ holds qitt.md and worker.md (charter sections), intake.md (the webhook task's prompt), deny.txt (send tools to block) and, if it needs one, a bridge.</text>
<text x="48" y="860" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#27272a" text-anchor="start">List it in ~/.config/qitt/sources.txt, run bin/install-profiles, and have the qitt thread create its webhook task. A module of your own can also live in ~/.config/qitt/sources/, outside the repo.</text>
</svg>
